name: Validate radio overhaul v0.99.28

on:
  push:
    branches:
      - validation/radio-world-slots-120quotes

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[validated-radio-v09928]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/radio-world-slots-120quotes
          fetch-depth: 0

      - name: Apply deterministic integration migration
        run: |
          node tools/apply-radio-overhaul-v09928.mjs
          base64 -d assets/wingman-radio/fox.png.base64tmp > assets/wingman-radio/fox.png
          test -s assets/wingman-radio/fox.png

      - name: Syntax checks
        run: |
          node --check src/combat/wingman-radio.js
          node --check src/combat/wingman-radio-callresponse.js
          node --check src/combat/wingman-world-radio.js
          node --check src/combat/wingmen.js
          node --check src/hud-wingman-radio-slots.js
          node --check src/hud.js
          node --check src/wingman-radio-overhaul.test.mjs
          node --check src/wingman-radio-callresponse.test.mjs
          node --check src/playtest-polish.test.mjs
          node --check src/selftest.mjs

      - name: Radio overhaul tests
        run: |
          node src/wingman-radio-callresponse.test.mjs
          node src/wingman-radio-overhaul.test.mjs

      - name: Wingman regression tests
        run: |
          node src/wingman-state-controller.test.mjs
          node src/wingman-formation-separation.test.mjs
          node src/wingman-navigation.test.mjs
          node src/damage-orbit-tracker.test.mjs
          node src/playtest-polish.test.mjs

      - name: Full deterministic selftest
        run: node src/selftest.mjs

      - name: Diff validation
        run: git diff --check

      - name: Commit validated tree
        run: |
          rm -f tools/apply-radio-overhaul-v09928.mjs
          rm -f .github/workflows/validate-radio-overhaul-v09928.yml
          rm -f README_TEMP_SHOULD_NOT_EXIST
          rm -f assets/wingman-radio/fox.png.base64tmp
          git add -A
          git config user.name "star-anki-validation"
          git config user.email "noreply@github.com"
          git commit -m "[validated-radio-v09928] feat: overhaul de radio distribuido"
          git push origin HEAD:validation/radio-world-slots-120quotes
