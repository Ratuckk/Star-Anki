name: Validate wingman formation fix

on:
  push:
    branches:
      - validation/wingman-formation-fix

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/wingman-formation-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node .github/scripts/apply-wingman-formation-fix.mjs
      - name: Syntax checks
        run: |
          node --check src/combat/wingman-formation-separation.js
          node --check src/combat/wingmen.js
          node --check src/wingman-formation-separation.test.mjs
          node --check src/wingman-state-controller.test.mjs
          node --check src/wingman-radio-callresponse.test.mjs
          node --check src/selftest.mjs
      - name: Deterministic tests
        run: |
          node src/wingman-formation-separation.test.mjs
          node src/wingman-state-controller.test.mjs
          node src/wingman-radio-callresponse.test.mjs
          node src/selftest.mjs
      - name: Diff validation
        run: git diff --check
      - name: Commit validated tree
        run: |
          rm -f .github/scripts/apply-wingman-formation-fix.mjs
          rm -f .github/workflows/validate-wingman-formation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: deconflita formacao dos wingmen"
          git push origin HEAD:validation/wingman-formation-fix
