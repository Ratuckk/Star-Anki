name: validate-post-merge-v09930

on:
  push:
    branches:
      - validation/post-merge-v09930

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/post-merge-v09930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.99.30 patch
        run: node tools/apply-post-merge-v09930.mjs
      - name: Syntax checks
        run: |
          node --check src/combat/wingman-flight-stability.js
          node --check src/combat/wingmen.js
          node --check src/combat/damage-feedback.js
          node --check src/hud-damage.js
          node --check src/hud.js
          node --check src/game-loop.js
          node --check src/wingman-flight-stability.test.mjs
          node --check src/wingman-radio-overhaul.test.mjs
          node --check src/damage-feedback.test.mjs
          node --check src/playtest-polish.test.mjs
      - name: Focused regression tests
        run: |
          node src/wingman-flight-stability.test.mjs
          node src/wingman-radio-overhaul.test.mjs
          node src/wingman-radio-callresponse.test.mjs
          node src/wingman-state-controller.test.mjs
          node src/wingman-formation-separation.test.mjs
          node src/wingman-navigation.test.mjs
          node src/damage-feedback.test.mjs
          node src/damage-orbit-tracker.test.mjs
          node src/playtest-polish.test.mjs
          node src/hud-speedlines.test.mjs
      - name: Full selftest
        run: node src/selftest.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated tree
        run: |
          git config user.name 'Tuck'
          git config user.email 'rafaelltuck@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: estabiliza wingmen e corrige radio e feedback visual'
            git push origin HEAD:validation/post-merge-v09930
          fi
