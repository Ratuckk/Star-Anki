name: validate-radio-cooldown-miyu-v09932

on:
  push:
    branches:
      - validation/radio-cooldown-miyu-v09932

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.99.32 migration
        run: node scripts/run-radio-cooldown-migration-v09932.mjs

      - name: Syntax checks
        run: |
          node --check src/combat/wingman-radio.js
          node --check src/combat/wingman-radio-callresponse.js
          node --check src/combat/wingmen.js
          node --check src/combat/index.js
          node --check src/game-loop.js
          node --check src/wingman-radio-overhaul.test.mjs
          node --check src/wingman-radio-callresponse.test.mjs

      - name: Focused radio tests
        run: |
          node src/wingman-radio-overhaul.test.mjs
          node src/wingman-radio-callresponse.test.mjs
          node src/wingman-state-controller.test.mjs
          node src/wingman-flight-stability.test.mjs
          node src/playtest-polish.test.mjs

      - name: Full selftest
        run: node src/selftest.mjs

      - name: Diff check
        run: git diff --check

      - name: Commit validated clean tree
        run: |
          rm scripts/apply-radio-cooldown-miyu-v09932.mjs
          rm scripts/run-radio-cooldown-migration-v09932.mjs
          rm -f scripts/.apply-radio-cooldown-miyu-v09932-fixed.mjs
          rm .github/workflows/validate-radio-cooldown-miyu-v09932.yml
          git config user.name "Star-Anki Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[validated-radio-v09932] fix: aplica cooldown e gate de lock da Miyu"
          git push
