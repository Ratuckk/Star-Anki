name: Full project bug hunt v0.99.32

on:
  push:
    branches:
      - audit/full-project-bughunt-v09932
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/full-project-bughunt-v09932
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply audited fixes in validation workspace
        shell: bash
        run: |
          node tools/apply-bughunt-fixes-v09932.mjs
          node tools/apply-bughunt-fixes-v09932-round2.mjs

      - name: Syntax check every runtime/test module
        shell: bash
        run: |
          set -o pipefail
          find src tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
          node --check service-worker.js

      - name: Run every dedicated test
        shell: bash
        run: |
          set -o pipefail
          for f in $(find src -maxdepth 2 -type f -name '*.test.mjs' | sort); do
            echo "===== $f ====="
            node "$f"
          done

      - name: Full selftest
        run: node src/selftest.mjs

      - name: Persistence and input fuzz
        run: node tools/state-fuzz-audit.mjs

      - name: Structural and asset audit
        run: node tools/full-project-audit.mjs

      - name: ESLint definite-bug rules
        shell: bash
        run: |
          npx --yes eslint@8.57.1 "src/**/*.js" "src/**/*.mjs" service-worker.js \
            --no-eslintrc \
            --env browser,es2022,node \
            --parser-options='{"ecmaVersion":"latest","sourceType":"module"}' \
            --rule='{"constructor-super":"error","for-direction":"error","getter-return":"error","no-async-promise-executor":"error","no-case-declarations":"error","no-class-assign":"error","no-compare-neg-zero":"error","no-cond-assign":"error","no-const-assign":"error","no-constant-binary-expression":"error","no-control-regex":"error","no-debugger":"error","no-dupe-args":"error","no-dupe-class-members":"error","no-dupe-else-if":"error","no-dupe-keys":"error","no-duplicate-case":"error","no-empty-character-class":"error","no-ex-assign":"error","no-extra-boolean-cast":"error","no-func-assign":"error","no-import-assign":"error","no-inner-declarations":"error","no-invalid-regexp":"error","no-irregular-whitespace":"error","no-loss-of-precision":"error","no-misleading-character-class":"error","no-new-native-nonconstructor":"error","no-new-symbol":"error","no-obj-calls":"error","no-promise-executor-return":"error","no-prototype-builtins":"error","no-redeclare":"error","no-self-assign":"error","no-setter-return":"error","no-shadow-restricted-names":"error","no-sparse-arrays":"error","no-this-before-super":"error","no-undef":"error","no-unexpected-multiline":"error","no-unmodified-loop-condition":"error","no-unreachable":"error","no-unreachable-loop":"error","no-unsafe-finally":"error","no-unsafe-negation":"error","no-unsafe-optional-chaining":"error","no-unused-private-class-members":"error","no-useless-backreference":"error","require-atomic-updates":"error","require-yield":"error","use-isnan":"error","valid-typeof":"error"}'

      - name: Browser audit setup
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core@1.55.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/star-anki-http.log 2>&1 &
          echo $! >/tmp/star-anki-http.pid
          sleep 2

      - name: Browser smoke audit
        run: node tools/browser-smoke-audit.mjs

      - name: Browser deep lifecycle audit
        run: node tools/browser-deep-audit.mjs

      - name: Server log
        if: always()
        run: cat /tmp/star-anki-http.log || true

      - name: Diff hygiene
        if: always()
        run: git diff --check
