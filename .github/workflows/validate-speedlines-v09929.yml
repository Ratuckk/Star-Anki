name: validate-speedlines-v09929

on:
  push:
    branches:
      - validation/speedlines-v09929

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fix temporary migrator escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-speedlines-v09929.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("      canvas.style.width = `${width}px`", "      canvas.style.width = width + 'px'")
          s = s.replace("      canvas.style.height = `${height}px`", "      canvas.style.height = height + 'px'")
          s = s.replace("      ctx.strokeStyle = `hsla(${line.hue}, 90%, 82%, ${alpha})`", "      ctx.strokeStyle = 'hsla(' + line.hue + ', 90%, 82%, ' + alpha + ')'")
          s = s.replace("    const signature = `${nextIsActive ? 1 : 0}:${Math.round(state.intensity)}`", "    const signature = (nextIsActive ? 1 : 0) + ':' + Math.round(state.intensity)")

          marker = "const progressPath = 'progresso/PROGRESSO_POS_.90.md'"
          end_marker = "console.log('apply-speedlines-v09929.mjs: OK')"
          start = s.index(marker)
          end = s.index(end_marker, start)
          safe_tail = """const progressPath = 'progresso/PROGRESSO_POS_.90.md'\nlet progress = fs.readFileSync(progressPath, 'utf8')\nif (!progress.includes('### v0.99.29 — Speedlines direcionais do Visual Lab no gameplay')) {\n  const progressEntry = [\n    '',\n    '',\n    '### v0.99.29 — Speedlines direcionais do Visual Lab no gameplay',\n    '',\n    '- O laboratório isolado permanece como referência; o gameplay reaproveita apenas a camada abstrata em canvas, sem duplicar estrelas/partículas ambientais.',\n    '- `src/hud-speedlines.js` substitui visualmente o spinner legado de `.hud-motion-lines` e preserva o contrato `hud.setMotionLines(active, intensity)`.',\n    '- Boost normal usa o preset escolhido 90/58/62/100/30/0 (intensidade/densidade/comprimento/espessura/brilho/bias); Swirl Blast e dash lateral continuam podendo elevar a intensidade a 100%. Fora desses gatilhos a intensidade é 0 e o canvas é limpo.',\n    '- O renderer usa pool determinístico de 180 linhas, RAF somente enquanto ativo, DPR limitado a 1.5, resize responsivo e dispose completo no unmount.',\n    '- O `aiValidator` registra apenas transições discretas de ligado/desligado/intensidade, sem log por frame.',\n    '- O Service Worker não ganhou manifesto fixo: o módulo novo segue a estratégia network-first já existente para módulos same-origin e entra no cache ao ser solicitado.',\n    '',\n    '**Validação automatizada:** `node --check` nos módulos alterados, `node src/hud-speedlines.test.mjs`, `node src/speedlines-prototype.test.mjs`, `node src/selftest.mjs` e `git diff --check`.',\n    '',\n    '**Playtest pendente:** confirmar no navegador que boost normal corresponde visualmente à referência do laboratório, Swirl/Dash atingem o pico sem o spinner legado, resize/restart não deixam canvas órfão e o console permanece limpo.',\n    '',\n  ].join('\\n')\n  fs.writeFileSync(progressPath, progress + progressEntry)\n}\n\n"""
          s = s[:start] + safe_tail + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply runtime integration
        run: node tools/apply-speedlines-v09929.mjs

      - name: Syntax checks
        run: |
          node --check src/hud-speedlines.js
          node --check src/hud.js
          node --check src/hud-speedlines.test.mjs
          node --check src/speedlines-prototype-model.js
          node --check src/speedlines-prototype.js

      - name: Focused speedlines tests
        run: |
          node src/hud-speedlines.test.mjs
          node src/speedlines-prototype.test.mjs

      - name: Regression suite
        run: node src/selftest.mjs

      - name: Diff validation
        run: git diff --check

      - name: Commit validated tree
        run: |
          git config user.name "star-anki-validator"
          git config user.email "actions@users.noreply.github.com"
          git add src/hud-speedlines.js src/hud-speedlines.test.mjs src/hud.js src/version.js progresso/PROGRESSO_POS_.90.md
          git status --short
          git commit -m "[validated-speedlines-v09929] integra speedlines direcionais no gameplay"
          git push origin HEAD:${GITHUB_REF_NAME}
