name: Validate wingman radio call response

on:
  push:
    branches:
      - validation/wingman-radio-callresponse

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/wingman-radio-callresponse
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: |
          node .github/scripts/apply-radio-core.mjs
          node .github/scripts/apply-radio-meta.mjs
      - name: Syntax checks
        run: |
          node --check src/combat/wingman-radio-callresponse.js
          node --check src/combat/wingman-radio.js
          node --check src/combat/wingmen.js
          node --check src/wingman-radio-callresponse.test.mjs
          node --check src/wingman-state-controller.test.mjs
          node --check src/selftest.mjs
      - name: Deterministic tests
        run: |
          node src/wingman-radio-callresponse.test.mjs
          node src/wingman-state-controller.test.mjs
          node src/selftest.mjs
      - name: Diff validation
        run: git diff --check
      - name: Commit validated tree
        run: |
          rm -f .github/scripts/apply-radio-core.mjs
          rm -f .github/scripts/apply-radio-meta.mjs
          rm -f .github/workflows/validate-wingman-radio-callresponse.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: adiciona call and response ao radio"
          git push origin HEAD:validation/wingman-radio-callresponse
