<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Anki — Laboratório de Speedlines</title>
  <link rel="icon" href="./icons/favicon-32.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --cyan: #73dcff;
      --blue: #3979ff;
      --panel: rgba(5, 10, 18, .88);
      --line: rgba(115, 220, 255, .24);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    button, input { font: inherit; }
    #viewport, #speedlines { position: fixed; inset: 0; width: 100%; height: 100%; }
    #viewport { display: block; }
    #speedlines { pointer-events: none; z-index: 2; }
    .vignette {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at 51% 46%, transparent 0 39%, rgba(0, 5, 12, .08) 64%, rgba(0, 0, 0, .56) 100%);
    }
    .hud { position: fixed; inset: 0; z-index: 4; pointer-events: none; color: #edf7ff; text-shadow: 0 2px 8px #000; }
    .hud-score { position: absolute; left: 18px; top: 18px; font-size: clamp(13px, 1.05vw, 19px); font-weight: 760; }
    .hud-score b { color: #fff; }
    .hud-chain { position: absolute; left: 30%; top: 5.5%; color: #66f5a1; font: 800 clamp(13px, 1vw, 18px) ui-monospace, monospace; }
    .hud-chain small { display: block; color: #8bdcff; font-size: .55em; letter-spacing: .12em; }
    .hud-distance { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); font-size: clamp(20px, 2vw, 34px); font-weight: 850; }
    .hud-reticle {
      position: absolute; left: 46%; top: 58%; width: 30px; height: 30px; border: 3px solid rgba(235,245,255,.68);
      border-radius: 50%; box-shadow: 0 0 13px rgba(120,205,255,.25); transform: translate(-50%,-50%);
    }
    .hud-radar { position: absolute; right: 20px; top: 18px; width: 142px; height: 142px; border: 2px solid #34404f; border-radius: 9px; background: rgba(5,9,15,.7); }
    .hud-radar::before { content: ''; position: absolute; left: 50%; top: 13px; width: 0; height: 0; border-left: 35px solid transparent; border-right: 35px solid transparent; border-top: 60px solid rgba(34,136,212,.13); transform: translateX(-50%); }
    .hud-radar::after { content: '▲'; position: absolute; left: 50%; top: 59px; color: #fff; transform: translateX(-50%); text-shadow: -5px 2px #42d4ff, 5px 2px #ff45bd; }
    .lab {
      position: fixed; z-index: 6; right: 18px; bottom: 18px; width: min(390px, calc(100vw - 36px)); max-height: calc(100vh - 190px);
      overflow: auto; padding: 15px 16px 16px; border: 1px solid var(--line); border-radius: 13px;
      color: #eaf7ff; background: linear-gradient(145deg, rgba(6,15,27,.94), rgba(2,6,12,.88));
      box-shadow: 0 18px 60px rgba(0,0,0,.68), inset 0 0 30px rgba(62,170,255,.045); backdrop-filter: blur(12px);
    }
    .lab-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .eyebrow { color: #7edcff; font: 750 10px ui-monospace, monospace; letter-spacing: .17em; text-transform: uppercase; }
    h1 { font-size: 18px; margin: 3px 0 0; letter-spacing: .01em; }
    .meter { flex: 0 0 auto; min-width: 66px; color: #fff; font: 900 22px ui-monospace, monospace; text-align: right; }
    .meter small { display: block; color: #68dfaa; font-size: 9px; letter-spacing: .12em; }
    .presets, .actions { display: flex; gap: 7px; margin: 9px 0 12px; }
    button {
      border: 1px solid rgba(115,220,255,.32); border-radius: 7px; padding: 7px 10px; color: #dff7ff;
      background: rgba(28,75,112,.38); cursor: pointer; font-size: 12px; font-weight: 760;
    }
    button:hover, button.active { border-color: #8ee7ff; background: rgba(35,124,183,.55); }
    .control { display: grid; grid-template-columns: 116px 1fr 42px; gap: 9px; align-items: center; margin: 8px 0; }
    .control label { font-size: 12px; color: #bad2e2; }
    .control output { color: #fff; font: 700 11px ui-monospace, monospace; text-align: right; }
    input[type="range"] { width: 100%; height: 4px; accent-color: #55cfff; }
    .toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
    .toggle { display: flex; align-items: center; gap: 6px; padding: 7px; border: 1px solid rgba(115,220,255,.16); border-radius: 7px; font-size: 11px; color: #c9dce8; }
    .toggle input { accent-color: #56dfff; }
    .status { margin-top: 11px; padding-top: 9px; border-top: 1px solid rgba(115,220,255,.14); color: #83e8b3; font: 700 10px ui-monospace, monospace; letter-spacing: .08em; }
    .legend { position: fixed; left: 18px; bottom: 18px; z-index: 5; color: rgba(220,240,255,.72); font: 600 11px ui-monospace, monospace; text-shadow: 0 2px 5px #000; pointer-events: none; }
    @media (max-width: 760px) {
      .lab { left: auto; right: 10px; bottom: 10px; width: min(310px, calc(100vw - 20px)); max-height: 46vh; padding: 12px; }
      .lab-head { margin-bottom: 7px; }
      h1 { font-size: 15px; }
      .presets { margin: 6px 0 9px; }
      .control { grid-template-columns: 92px 1fr 36px; gap: 6px; margin: 6px 0; }
      .hud-radar { width: 90px; height: 90px; }
      .hud-radar::after { top: 34px; }
      .hud-radar::before { display: none; }
      .legend { display: none; }
      .toggles { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="viewport" aria-label="Cena tridimensional do laboratório de speedlines"></canvas>
  <canvas id="speedlines" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="hud" aria-hidden="true">
    <div class="hud-score">Pontos: <b>2420</b> · Combo x1.00 · Nível 1/9</div>
    <div class="hud-chain"><small>CADEIA</small>x0</div>
    <div class="hud-distance" id="distance">109</div>
    <div class="hud-reticle"></div>
    <div class="hud-radar"></div>
  </div>

  <aside class="lab" aria-label="Controles do laboratório visual">
    <div class="lab-head">
      <div><div class="eyebrow">Protótipo isolado · câmera fixa</div><h1>Speedlines Lab</h1></div>
      <div class="meter"><span id="meter">78</span>%<small id="band">MUITO ALTA</small></div>
    </div>
    <div class="presets">
      <button type="button" data-preset="neutral">Neutro</button>
      <button type="button" data-preset="high">Alta</button>
      <button type="button" data-preset="extreme">Extrema</button>
    </div>
    <div class="control"><label for="intensity">Intensidade</label><input id="intensity" type="range" min="0" max="100" step="1"><output></output></div>
    <div class="control"><label for="density">Densidade</label><input id="density" type="range" min="0" max="100" step="1"><output></output></div>
    <div class="control"><label for="length">Comprimento</label><input id="length" type="range" min="0" max="100" step="1"><output></output></div>
    <div class="control"><label for="thickness">Espessura</label><input id="thickness" type="range" min="0" max="100" step="1"><output></output></div>
    <div class="control"><label for="brightness">Brilho</label><input id="brightness" type="range" min="0" max="100" step="1"><output></output></div>
    <div class="control"><label for="peripheralBias">Bias periférico</label><input id="peripheralBias" type="range" min="0" max="100" step="1"><output></output></div>
    <div class="toggles">
      <label class="toggle"><input id="environmental" type="checkbox"> Ambientais</label>
      <label class="toggle"><input id="abstract" type="checkbox"> Abstratas</label>
      <label class="toggle"><input id="boss" type="checkbox"> Boss</label>
    </div>
    <div class="actions"><button id="pause" type="button">Pausar cena</button><button id="reset" type="button">Restaurar</button></div>
    <div class="status" id="status">CAMADAS SINCRONIZADAS // LEITURA PERIFÉRICA</div>
  </aside>
  <div class="legend">REFERÊNCIA VISUAL: COMPOSIÇÃO DO GAMEPLAY · [ESPAÇO] PAUSA · [1/2/3] PRESETS</div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
  <script type="module" src="./src/speedlines-prototype.js"></script>
</body>
</html>
